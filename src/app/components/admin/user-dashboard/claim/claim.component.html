
<h4>Add Claims</h4>
@if (claimsLoaded) {
  <div class="d-flex justify-content-center">
    <p-select [options]="claims" [(ngModel)]="selectedClaim" placeholder="Select a Claim" optionLabel="name" class="mr-4" [showClear]="true"></p-select>
    <button pButton label="Add Claim" type="button" icon="pi pi-plus" class="p-button-success ml-4" (click)="addClaim()"></button>
  </div>
}

<h4>Delete Claims</h4>
@if (userClaimsLoaded) {
  <div class="d-flex justify-content-center">
    @for (claim of userClaims; track claim) {
      <div>
        <div class="column-auto">
          <button pButton pRipple type="button" label="{{claim.name}}" icon="pi pi-times" class="p-button-rounded p-button-danger p-button-text" (click)="deleteClaim(claim)"></button>
        </div>
      </div>
    }
  </div>
}
